Since I am choosing the next move, we are going to build the **Data Foundation**. 

You cannot open a booster pack, stock a shelf, or haggle with a customer if the game engine does not know what a "MyMoji" is. We need a central dictionary that holds the stats, value, and rarity of every item in the game.

### **1. Creating the MyMoji Database**

In your Codespaces file tree, create a new folder named `js`, inside that create another folder named `data`, and finally create a file named `database.js`. 

Here is the starter code. We are using a simple JavaScript array of objects, which makes it very easy to filter (e.g., finding all "Rare" cards) or pick a random item later.
```javascript

    {
        id: "moji_001",
        name: "Classic Smile",

    {
