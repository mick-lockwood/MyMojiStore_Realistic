<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoji Store</title>
    <!-- Load Phaser -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    
    <!-- Load our database -->
    <script src="js/data/database.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1024,
            height: 768,
            backgroundColor: '#2c3e50', // A nice dark blue-grey for the shop counter
            scene: {
                create: create
            }
        };

        const game = new Phaser.Game(config);

        function create() {
            // 1. Pull the very first Moji from our database
            const mojiData = myMojiDatabase[0];

            // 2. Create a Container to hold all the card parts
            // We'll place it right in the middle of the screen (512, 384)
            const card = this.add.container(512, 384);

            // 3. Build the card visuals
            // Background: Crisp white with a thick dark border
            const cardBg = this.add.rectangle(0, 0, 220, 320, 0xffffff);
            cardBg.setStrokeStyle(6, 0x1a1a1a);

            // Image Placeholder: Light gray box where your Photoshop art will go
            const imageBox = this.add.rectangle(0, -40, 180, 160, 0xe0e0e0);
            imageBox.setStrokeStyle(3, 0xcccccc);

            // Text Elements: Pulling dynamic data from mojiData
            const nameText = this.add.text(0, -140, mojiData.name, { 
                fontFamily: 'Arial', fontSize: '20px', color: '#000000', fontStyle: 'bold' 
            }).setOrigin(0.5);

            const rarityText = this.add.text(0, 70, mojiData.rarity, { 
                fontFamily: 'Arial', fontSize: '16px', color: '#7f8c8d' 
            }).setOrigin(0.5);

            const valueText = this.add.text(0, 110, '$' + mojiData.baseValue.toFixed(2), { 
                fontFamily: 'Arial', fontSize: '24px', color: '#27ae60', fontStyle: 'bold' 
            }).setOrigin(0.5);

            // 4. Add all the parts into the container
            card.add([cardBg, imageBox, nameText, rarityText, valueText]);

            // 5. Make the container interactive
            // We have to tell Phaser how big the "clickable" area is based on the background
            card.setSize(220, 320);
            card.setInteractive();
            this.input.setDraggable(card);

            // 6. The Drag Mechanics
            this.input.on('drag', function (pointer, gameObject, dragX, dragY) {
                gameObject.x = dragX;
                gameObject.y = dragY;
            });

            // Polish: "Pick up" the card by scaling it up and bringing it to the front
            this.input.on('dragstart', function (pointer, gameObject) {
                gameObject.setScale(1.05);
                this.children.bringToTop(gameObject); // Ensures it renders above other objects
            }, this);

            // Polish: "Put down" the card
            this.input.on('dragend', function (pointer, gameObject) {
                gameObject.setScale(1);
            });
        }
    </script>
</body>
</html>
