<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoji Store</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    <script src="js/data/myMojiDatabase.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1024,
            height: 768,
            backgroundColor: '#2c3e50', 
            scene: {
                create: create
            }
        };

        const game = new Phaser.Game(config);

        function create() {
            // Create a simple "Open Pack" button at the bottom of the screen
            const packButton = this.add.rectangle(512, 680, 240, 60, 0x27ae60).setInteractive();
            packButton.setStrokeStyle(4, 0x1a1a1a);
            
            const btnText = this.add.text(512, 680, 'OPEN PACK ($5)', { 
                fontFamily: 'Arial', fontSize: '20px', color: '#ffffff', fontStyle: 'bold' 
            }).setOrigin(0.5);

            // Make the button do something when clicked
            packButton.on('pointerdown', () => {
                packButton.setScale(0.95); // Squish effect
                spawnBoosterPack(this);
            });

            packButton.on('pointerup', () => {
                packButton.setScale(1); // Un-squish
            });
        }

        // --- NEW SYSTEMS ---

        // 1. The Spawner: Grabs 3 random cards and spaces them out
        function spawnBoosterPack(scene) {
            const spacing = 260; // Distance between cards
            let startX = 252;    // X coordinate for the first card

            for (let i = 0; i < 3; i++) {
                // Grab a completely random Moji from your database array
                let randomMoji = Phaser.Utils.Array.GetRandom(myMojiDatabase);
                
                // Draw the card on the screen, shifting it right each loop
                createCard(scene, startX + (i * spacing), 350, randomMoji);
            }
        }

        // 2. The Card Factory: Our old code, now wrapped in a reusable function
        function createCard(scene, x, y, mojiData) {
            const card = scene.add.container(x, y);

            const cardBg = scene.add.rectangle(0, 0, 220, 320, 0xffffff);
            cardBg.setStrokeStyle(6, 0x1a1a1a);

            const imageBox = scene.add.rectangle(0, -40, 180, 160, 0xe0e0e0);
            imageBox.setStrokeStyle(3, 0xcccccc);

            const nameText = scene.add.text(0, -140, mojiData.name, { 
                fontFamily: 'Arial', fontSize: '20px', color: '#000000', fontStyle: 'bold' 
            }).setOrigin(0.5);

            const rarityText = scene.add.text(0, 70, mojiData.rarity, { 
                fontFamily: 'Arial', fontSize: '16px', color: '#7f8c8d' 
            }).setOrigin(0.5);

            const valueText = scene.add.text(0, 110, '$' + mojiData.baseValue.toFixed(2), { 
                fontFamily: 'Arial', fontSize: '24px', color: '#27ae60', fontStyle: 'bold' 
            }).setOrigin(0.5);

            card.add([cardBg, imageBox, nameText, rarityText, valueText]);

            card.setSize(220, 320);
            card.setInteractive();
            scene.input.setDraggable(card);

            scene.input.on('drag', function (pointer, gameObject, dragX, dragY) {
                gameObject.x = dragX;
                gameObject.y = dragY;
            });

            scene.input.on('dragstart', function (pointer, gameObject) {
                gameObject.setScale(1.05);
                scene.children.bringToTop(gameObject);
            });

            scene.input.on('dragend', function (pointer, gameObject) {
                gameObject.setScale(1);
            });
        }
    </script>
</body>
</html>
